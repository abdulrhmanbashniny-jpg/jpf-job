services:
  db:
    image: postgres:17-alpine
    container_name: smart_hr_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-smart_hr_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-StrongSecretPass2026}
      POSTGRES_DB: ${POSTGRES_DB:-smart_hr_db}
      TZ: Asia/Riyadh
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database/schema_and_seed.sql:/docker-entrypoint-initdb.d/01-schema_and_seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-smart_hr_user} -d ${POSTGRES_DB:-smart_hr_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: smart_hr_app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${BIND_IP:-0.0.0.0}:${PORT:-3000}:3000"
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER:-smart_hr_user}:${POSTGRES_PASSWORD:-StrongSecretPass2026}@db:5432/${POSTGRES_DB:-smart_hr_db}
      AUTO_SEED_DB: "true"
      AI_DEFAULT_PROVIDER: ${AI_DEFAULT_PROVIDER:-smart-rubric}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:7b}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-10}
      ADMIN_ACCESS_CODE: ${ADMIN_ACCESS_CODE:-RUWAA-HR-2026}
      SESSION_SECRET: ${SESSION_SECRET:-}
      # v2.3 — WAHA: الشبكة الداخلية المشتركة + قفل Dry-Run الإلزامي (القيم هنا افتراضية آمنة فقط،
      # ولا تُوضع أي أسرار في هذا الملف: WAHA_API_KEY و WAHA_WEBHOOK_SECRET يضبطهما Hermes على الخادم في .env)
      WAHA_BASE_URL: ${WAHA_BASE_URL:-http://waha-bbg7-waha-1:3000}
      WAHA_SESSION: ${WAHA_SESSION:-default}
      WAHA_DRY_RUN: ${WAHA_DRY_RUN:-true}
      WAHA_LIVE_APPROVED: ${WAHA_LIVE_APPROVED:-false}
      WAHA_API_KEY: ${WAHA_API_KEY:-}
      WAHA_WEBHOOK_SECRET: ${WAHA_WEBHOOK_SECRET:-}
    networks:
      - default
      # شبكة WAHA القائمة على الخادم: يجب أن تُثبت Reachability من حاوية التطبيق قبل صحة هذا الربط
      - waha_net
    volumes:
      - uploads_data:/app/uploads

networks:
  # شبكة خارجية موجودة مسبقاً باسم waha-bbg7_default (حاوية waha-bbg7-waha-1)
  waha_net:
    external: true
    name: ${WAHA_DOCKER_NETWORK:-waha-bbg7_default}

volumes:
  pgdata:
  uploads_data:
