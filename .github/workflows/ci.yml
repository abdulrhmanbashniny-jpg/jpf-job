name: JPF Smart HR — Production CI

on:
  push:
    branches: [ "main", "release/**" ]
  pull_request:
    branches: [ "main" ]

jobs:
  verify-platform:
    name: Schema Parity, PoP Ownership, WA State & Isolated DB Drills
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres_ci_password
          POSTGRES_DB: smart_hr_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout full jpf-job repository history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install PostgreSQL 17 client tools (matching postgres:17-alpine)
        run: |
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y postgresql-client-17
          echo "/usr/lib/postgresql/17/bin" >> $GITHUB_PATH

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium for real headless browser E2E verification
        run: npx playwright install --with-deps chromium

      - name: Initialize & verify PostgreSQL schema and seed
        env:
          DATABASE_URL: postgresql://postgres:postgres_ci_password@127.0.0.1:5432/smart_hr_db
        run: npm run db:init

      - name: Verify Public Portal, RBAC Protection, Session Auth & Ollama Endpoints
        env:
          PORT: 3000
          HOST: 127.0.0.1
          ADMIN_ACCESS_CODE: CI-TEST-ADMIN-2026
          DATABASE_URL: postgresql://postgres:postgres_ci_password@127.0.0.1:5432/smart_hr_db
        run: |
          node server.js &
          SERVER_PID=$!
          sleep 3
          curl -fsS http://127.0.0.1:3000/api/health
          curl -fsS http://127.0.0.1:3000/index.html >/dev/null
          curl -fsS http://127.0.0.1:3000/Apply.dc.html >/dev/null
          curl -fsS http://127.0.0.1:3000/Assessment.dc.html >/dev/null
          curl -fsS http://127.0.0.1:3000/Visit.dc.html >/dev/null
          curl -fsS http://127.0.0.1:3000/img/hq-entrance.svg >/dev/null
          curl -fsS http://127.0.0.1:3000/Login.dc.html >/dev/null

          DASH_CODE=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:3000/Dashboard.dc.html)
          test "$DASH_CODE" = "302"
          API_CODE=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:3000/api/stats)
          test "$API_CODE" = "401"
          APP_ENUM_CODE=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:3000/api/applications/APP-2026-1001)
          test "$APP_ENUM_CODE" = "403"
          VISIT_ENUM_CODE=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:3000/api/public/visit/APP-2026-1001)
          test "$VISIT_ENUM_CODE" = "403"

          curl -fsS -c /tmp/cookies.txt -X POST http://127.0.0.1:3000/api/auth/login \
            -H "Content-Type: application/json" \
            -d '{"username":"admin","password":"CI-TEST-ADMIN-2026"}'
          curl -fsS -b /tmp/cookies.txt http://127.0.0.1:3000/Dashboard.dc.html >/dev/null
          curl -fsS -b /tmp/cookies.txt http://127.0.0.1:3000/Ranking.dc.html >/dev/null
          curl -fsS -b /tmp/cookies.txt http://127.0.0.1:3000/Interviews.dc.html >/dev/null
          curl -fsS -b /tmp/cookies.txt http://127.0.0.1:3000/Users.dc.html >/dev/null
          curl -fsS -b /tmp/cookies.txt http://127.0.0.1:3000/api/stats >/dev/null
          curl -fsS -b /tmp/cookies.txt "http://127.0.0.1:3000/api/ranking?passed_only=1" >/dev/null
          curl -fsS -b /tmp/cookies.txt http://127.0.0.1:3000/api/wa-messages >/dev/null
          curl -fsS -b /tmp/cookies.txt http://127.0.0.1:3000/api/ollama/models >/dev/null
          rm -f /tmp/cookies.txt
          kill $SERVER_PID

      - name: Run Isolated v2.1 Security, 139-Column Parity & Backup/Restore Suite (verify:v21)
        run: |
          # التأكد أولاً من أن حواجز الأمان ترفض التشغيل بدون المتغير الصريح أو في وضع الإنتاج
          if ALLOW_ISOLATED_DRILL=0 node scripts/verify-v21-drills.js 2>/dev/null; then exit 1; fi
          if ALLOW_ISOLATED_DRILL=1 NODE_ENV=production DRILL_PG_ADMIN_URL="postgresql://postgres:postgres_ci_password@127.0.0.1:5432/postgres" node scripts/verify-v21-drills.js 2>/dev/null; then exit 1; fi
          ALLOW_ISOLATED_DRILL=1 DRILL_PG_ADMIN_URL="postgresql://postgres:postgres_ci_password@127.0.0.1:5432/postgres" npm run verify:v21

      - name: Run Isolated v2.2a Smart QR Reception Security, Concurrency & Chromium E2E Suite (verify:v22a)
        run: |
          ALLOW_ISOLATED_DRILL=1 DRILL_PG_ADMIN_URL="postgresql://postgres:postgres_ci_password@127.0.0.1:5432/postgres" npm run verify:v22a

  container-upgrade-rollback-drill:
    name: Docker Compose Upgrade, Override, Uploads Backup & Rollback Drill
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full jpf-job repository history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Execute Isolated Containerized v2.0 -> v2.1 -> Restore -> v2.0 Rollback Drill
        env:
          ALLOW_ISOLATED_CONTAINER_DRILL: "1"
        run: bash scripts/ci-container-rollback-drill.sh
