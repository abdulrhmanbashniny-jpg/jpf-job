<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>تسجيل دخول لجنة التوظيف | رُواء للتوظيف الذكي</title>
  <link rel="stylesheet" href="css/design-system.css" />
  <style>
    .login-page {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background:
        radial-gradient(circle at 18% 20%, rgba(224, 162, 27, 0.18), transparent 40%),
        radial-gradient(circle at 85% 80%, rgba(200, 85, 61, 0.22), transparent 42%),
        var(--charcoal);
    }
    .login-card {
      width: 100%;
      max-width: 460px;
      background: #FFFFFF;
      border-radius: 24px;
      padding: 38px 34px;
      box-shadow: var(--shadow-lg);
      border-top: 7px solid var(--terracotta);
    }
  </style>
</head>
<body>
  <div class="login-page">
    <div class="login-card">
      <div style="display:flex;align-items:center;gap:14px;margin-bottom:24px;">
        <div class="brand-swatch">ر</div>
        <div>
          <h1 style="font-size:20px;">بوابة لجنة التوظيف والإدارة</h1>
          <span style="font-size:12px;color:var(--text-muted);">دخول محمي بنظام الصلاحيات وجلسات HttpOnly</span>
        </div>
      </div>

      <form id="login-form">
        <div class="form-group">
          <label class="form-label" for="username">اسم المستخدم *</label>
          <input type="text" id="username" class="form-control mono" placeholder="admin" autocomplete="username" required />
        </div>

        <div class="form-group">
          <label class="form-label" for="password">كلمة المرور *</label>
          <input type="password" id="password" class="form-control mono" placeholder="••••••••••••" autocomplete="current-password" required />
        </div>

        <div id="login-error" style="display:none;background:var(--terracotta-soft);color:var(--terracotta);padding:11px 14px;border-radius:10px;font-size:13px;font-weight:600;margin-bottom:16px;"></div>

        <button type="submit" id="login-btn" class="btn btn-terracotta btn-lg" style="width:100%;">
          تسجيل الدخول إلى لوحة اللجنة ←
        </button>
      </form>

      <div style="margin-top:22px;padding-top:16px;border-top:1px solid var(--border-color);display:flex;justify-content:space-between;align-items:center;font-size:13px;">
        <span style="color:var(--text-muted);">متقدم لوظيفة؟</span>
        <a href="index.html" style="color:var(--olive);font-weight:700;">العودة إلى بوابة الوظائف العامة ←</a>
      </div>
    </div>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const nextUrl = params.get('next') || 'Dashboard.dc.html';

    // إذا كان مسجلاً بالفعل، يتم توجيهه مباشرة
    fetch('/api/auth/me').then((r) => {
      if (r.ok) window.location.replace(nextUrl);
    }).catch(() => {});

    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const errEl = document.getElementById('login-error');
      const btn = document.getElementById('login-btn');
      errEl.style.display = 'none';
      btn.disabled = true;
      btn.textContent = 'جاري التحقق من الصلاحيات...';

      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            username: document.getElementById('username').value.trim(),
            password: document.getElementById('password').value
          })
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'فشل تسجيل الدخول');
        window.location.replace(nextUrl);
      } catch (err) {
        errEl.textContent = err.message;
        errEl.style.display = 'block';
        btn.disabled = false;
        btn.textContent = 'تسجيل الدخول إلى لوحة اللجنة ←';
      }
    });
  </script>
</body>
</html>
