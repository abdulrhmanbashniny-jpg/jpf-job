<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>تقرير نتيجة الاختبار | رُواء للتوظيف الذكي</title>
  <link rel="stylesheet" href="css/design-system.css" />
  <style>
    .result-card {
      max-width: 900px;
      margin: 12px auto 0;
      background: #FFFFFF;
      border-radius: 24px;
      border: 1px solid var(--border-color);
      border-top: 8px solid var(--terracotta);
      padding: 40px;
      box-shadow: var(--shadow-md);
    }
    .ring-wrap {
      width: 165px;
      height: 165px;
      position: relative;
      margin: 0 auto;
    }
    .ring-center {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
  </style>
</head>
<body>
  <div id="portal-header-mount"></div>

  <main class="container-1440">
    <div class="stepper">
      <div class="step-item done"><span class="step-num">✓</span><span>البيانات والسيرة</span></div>
      <span style="color:var(--olive);">━━</span>
      <div class="step-item done"><span class="step-num">✓</span><span>اختبار الجدارة</span></div>
      <span style="color:var(--terracotta);">━━</span>
      <div class="step-item active" style="background:var(--terracotta);border-color:var(--terracotta);"><span class="step-num" style="background:#FFF;color:var(--terracotta);">3</span><span>تقرير التقييم الفوري</span></div>
    </div>

    <div id="result-fail-mount" class="result-card">
      <div style="text-align:center;padding:30px;">جاري تحميل تقرير التقييم...</div>
    </div>
  </main>

  <div id="portal-footer-mount"></div>

  <script src="js/common.js"></script>
  <script>
    SmartHR.renderPortalHeader('result');
    SmartHR.renderPortalFooter();

    async function loadFailResult() {
      const params = new URLSearchParams(window.location.search);
      const ref = params.get('ref') || 'APP-2026-1006';
      const mount = document.getElementById('result-fail-mount');

      try {
        const [res, jobsRes] = await Promise.all([
          SmartHR.apiFetch(`/api/applications/${encodeURIComponent(ref)}`),
          SmartHR.apiFetch('/api/jobs')
        ]);

        const app = res.application;
        const score = Number(app.assessment_score || 0);
        const passing = Number(app.passing_score || 60);

        if (score >= passing && params.get('ref')) {
          window.location.replace(`ResultPass.dc.html?ref=${encodeURIComponent(app.reference_no)}`);
          return;
        }

        const radius = 68;
        const circumference = 2 * Math.PI * radius;
        const offset = circumference - (Math.min(100, score) / 100) * circumference;
        const report = app.ai_report || {};
        const altJobs = (jobsRes.jobs || []).filter((j) => j.id !== app.job_id).slice(0, 2);

        mount.innerHTML = `
          <div style="display:grid;grid-template-columns:210px 1fr;gap:30px;align-items:center;">
            <div class="ring-wrap">
              <svg width="165" height="165" style="transform:rotate(-90deg);">
                <circle cx="82.5" cy="82.5" r="${radius}" fill="none" stroke="#EAE5DB" stroke-width="13" />
                <circle id="fail-circle" cx="82.5" cy="82.5" r="${radius}" fill="none" stroke="#C8553D" stroke-width="13"
                  stroke-linecap="round" stroke-dasharray="${circumference}" stroke-dashoffset="${circumference}"
                  style="transition:stroke-dashoffset 1.1s ease;" />
              </svg>
              <div class="ring-center">
                <span class="mono" style="font-size:28px;font-weight:800;color:var(--terracotta);">${score}%</span>
                <span style="font-size:12px;color:var(--text-secondary);">المطلوب ${passing}%</span>
              </div>
            </div>

            <div>
              <span class="badge badge-terracotta" style="margin-bottom:10px;">لم يتحقق الحد الأدنى للاجتياز (${passing}%)</span>
              <h1 style="font-size:25px;margin-bottom:8px;">نشكرك ${SmartHR.escapeHtml(app.full_name)} على وقتك واهتمامك بالانضمام إلينا</h1>
              <p style="color:var(--text-secondary);font-size:14px;margin-bottom:14px;">
                أظهر التقييم الفوري لوظيفة <strong>${SmartHR.escapeHtml(app.job_title)}</strong> (<span class="mono">${SmartHR.escapeHtml(app.job_code)}</span>) أن الدرجة المحققة أقل من معيار الاجتياز المعتمد لهذا الدور حالياً، مع الاحتفاظ بسجلك في قاعدة الكفاءات للفرص المستقبلية المناسبة.
              </p>
              <div style="display:inline-flex;gap:10px;align-items:center;background:var(--bg-subtle);padding:8px 14px;border-radius:8px;font-size:13px;">
                <span>رقم الطلب المرجعي:</span>
                <strong class="mono">${SmartHR.escapeHtml(app.reference_no)}</strong>
              </div>
            </div>
          </div>

          <div class="grid-2" style="margin-top:28px;">
            <div class="card-subtle">
              <h3 style="font-size:16px;margin-bottom:10px;color:var(--terracotta);">📌 محاور التطوير الموصى بها مهنياً</h3>
              <ul style="padding-right:18px;font-size:13px;color:var(--text-secondary);display:flex;flex-direction:column;gap:8px;">
                ${(report.gaps || ['تعزيز الجوانب التطبيقية والحسابية المرتبطة بالوظيفة']).map((g) => `<li>${SmartHR.escapeHtml(g)}</li>`).join('')}
              </ul>
            </div>

            <div class="card-subtle">
              <h3 style="font-size:16px;margin-bottom:10px;">🔄 فرص وظيفية بديلة قد تناسب خبراتك</h3>
              <div style="display:flex;flex-direction:column;gap:10px;">
                ${altJobs.map((j) => `
                  <a href="Job.dc.html?id=${j.id}" style="display:flex;justify-content:space-between;align-items:center;padding:10px 12px;background:#FFF;border:1px solid var(--border-color);border-radius:9px;">
                    <span style="font-size:13px;font-weight:600;">${SmartHR.escapeHtml(j.title)}</span>
                    <span class="code-chip">${SmartHR.escapeHtml(j.code)}</span>
                  </a>
                `).join('')}
              </div>
            </div>
          </div>

          <div style="margin-top:26px;padding-top:18px;border-top:1px solid var(--border-color);display:flex;justify-content:space-between;">
            <a href="index.html" class="btn btn-primary">استعراض كافة الشواغر المتاحة ←</a>
          </div>
        `;

        requestAnimationFrame(() => {
          setTimeout(() => {
            const c = document.getElementById('fail-circle');
            if (c) c.style.strokeDashoffset = String(offset);
          }, 80);
        });
      } catch (err) {
        mount.innerHTML = `<div style="color:var(--terracotta);text-align:center;">${SmartHR.escapeHtml(err.message)}</div>`;
      }
    }

    loadFailResult();
  </script>
</body>
</html>
